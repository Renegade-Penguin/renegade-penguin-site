# CI for the Renegade Penguin site. The Hugo build, the output checks and the test scripts are one call to
# the shared parallel-ci workflow in ChiefGyk3D/git-your-ship-together (GYST): one build, then the checks side
# by side, each on the build. Shell lint and security scans are the other shared workflows. `CI green` is the
# single required check; it stays a job of this file because a called workflow's check run is named
# `<caller job> / <job>` and branch protection names `CI green` exactly.
#
# scripts/test-render-review.sh is deliberately not run here: it binds local ports and spawns servers.
# It is a local review aid, run by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories surface between commits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/parallel-ci.yml@ff658b7c11a55eea1394af5fd1a3a1b4b09d9cd0 # v1.36.0
    permissions:
      contents: read
    with:
      # Pinned, checksum verified Hugo. The tarball goes to hugo-dl (cacheable once egress is block), the
      # binary to hugo; PATH is set in this shell only, nothing is written to GITHUB_PATH.
      setup-command: |
        version="$(tr -d '[:space:]' < .hugo-version)"
        base="https://github.com/gohugoio/hugo/releases/download/v${version}"
        tarball="hugo_${version}_linux-amd64.tar.gz"
        mkdir -p "$RUNNER_TEMP/hugo-dl" "$RUNNER_TEMP/hugo"
        (
          cd "$RUNNER_TEMP/hugo-dl"
          [ -f "$tarball" ] || curl -fsSL --retry 3 -O "${base}/${tarball}"
          curl -fsSL --retry 3 -O "${base}/hugo_${version}_checksums.txt"
          grep " ${tarball}\$" "hugo_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP/hugo" hugo
        )
        export PATH="$RUNNER_TEMP/hugo:$PATH"
      # The installed Hugo must be the pinned one, then the production build, then the staging variant
      # (params.environment = staging: noindex on every page, robots.txt disallows all), built outside the
      # repository and shared as the second output.
      build-command: |
        want="$(tr -d '[:space:]' < .hugo-version)"
        have="$(hugo version | sed -n 's/^hugo v\([0-9][0-9.]*\).*/\1/p')"
        if [ "$have" != "$want" ]; then
          echo "hugo version mismatch: installed '$have', .hugo-version '$want'" >&2
          exit 1
        fi
        hugo --minify --gc
        HUGO_PARAMS_ENVIRONMENT=staging hugo --minify --gc --destination "$RUNNER_TEMP/public-staging"
      build-output-path: public
      extra-output-path: RUNNER_TEMP/public-staging
      build-timeout-minutes: 15
      cache-tool-path: RUNNER_TEMP/hugo-dl
      cache-tool-key-files: '[".hugo-version"]'
      # audit, not block (issue #10): the allow-list for these jobs has not been measured yet. Follow-up: switch to
      # block with the endpoints from the first run's report; block also turns the Hugo tarball cache on.
      egress-policy-secretless: audit
      # TODO(issue #9): the output checker requires a scrub term list. The real list is secret and is not in
      # this repository; real scrub terms come from the secret manager when the owner supplies them. Until
      # then each output check job writes a file with one non-secret placeholder pattern and a comment line.
      jobs: |
        [
            {"name": "output checks", "command": "terms=\"$RUNNER_TEMP/scrub-terms.txt\"\n{ echo \"# placeholder, real terms come from the secret manager\"; echo \"zz-ci-placeholder-term-zz\"; } > \"$terms\"\nEXPECT_ENV=production SCRUB_TERMS_FILE=\"$terms\" scripts/check-output.sh public\nEXPECT_ENV=staging SCRUB_TERMS_FILE=\"$terms\" scripts/check-output.sh \"$RUNNER_TEMP/public-staging\"", "timeout": 10},
            {"name": "site tests", "command": "scripts/test-build.sh\nscripts/test-home-data.sh\nscripts/test-no-light-fills.sh\nscripts/test-logos.sh\nscripts/test-pages.sh\nscripts/test-seo.sh\nscripts/test-guides.sh\nscripts/test-nav.sh\nscripts/test-nextsteps.sh\nscripts/test-hubs.sh\nscripts/test-a11y.sh\nscripts/test-pages-config.sh\nscripts/test-cutover-prep.sh\nscripts/test-render-link.sh\nscripts/test-claims.sh\nscripts/test-jsonld.sh\nscripts/test-faq.sh\nscripts/test-links.sh\nscripts/test-email-off.sh\nscripts/test-trust.sh\nscripts/test-social.sh\nscripts/test-robots.sh\nscripts/test-fresh.sh\nscripts/test-check-output.sh\nscripts/test-scrub.sh\nscripts/staging/test-lib.sh\nscripts/staging/test-hardening.sh\nscripts/staging/test-ensure-pages-project.sh\nscripts/staging/test-attach-staging-domain.sh\nscripts/staging/test-ensure-turnstile.sh\nscripts/staging/test-ensure-rate-limit.sh\nnode --test functions/test/contact.test.js\nnode --test worker/mail/test/mail.test.js\npython3 -I scripts/test-ci-workflow.py", "timeout": 20, "tools": true, "build": false},
            {"name": "contrast", "command": "python3 -I scripts/check-contrast.py assets/css/tokens.css\nscripts/test-check-contrast.sh", "timeout": 10, "build": false}
        ]

  shell:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@ff658b7c11a55eea1394af5fd1a3a1b4b09d9cd0 # v1.36.0
    permissions:
      contents: read
    with:
      test-command: ./scripts/test-check-contrast.sh   # needs no Hugo; the ci job runs the Hugo-based tests
      shfmt-args: "-i 2 -ci"   # the scripts here are 2-space indented; bash-ci defaults to -i 4 -ci
      egress-policy: block
      timeout-minutes: 20

  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@ff658b7c11a55eea1394af5fd1a3a1b4b09d9cd0 # v1.36.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write   # declared by the called workflow's snyk and scorecard jobs; checked statically
    with:
      codeql-languages: actions   # no Python or other CodeQL language in this repository
      pip-audit-requirements: ""  # no Python dependencies; the empty string skips the job
      egress-policy: block

  ci-green:
    name: CI green
    if: always()
    needs: [ci, shell, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          bad="$(echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          print(" ".join(k for k, v in needs.items() if v["result"] != "success"))
          ')"
          if [ -n "$bad" ]; then
            echo "not green: $bad"
            exit 1
          fi
