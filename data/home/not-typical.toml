eyebrow = "Practitioner Led"
title = "Not the Typical vCISO or vCIO"
intro = "Renegade Penguin brings about 16 years of hands-on security work to the decisions most advisors only discuss. The advice comes from building, testing, and questioning the systems involved."

[[items]]
title = "Hands-On Judgment"
body = "I have worked incidents and outages firsthand, stayed hands-on, and managed teams through them. My advice comes from that direct experience, not books or vendor decks."

[[items]]
title = "Wireless From First Principles"
body = "Networking knowledge reaches the radio layer, including how wireless communications behave, fail, and must be positioned to work well."

[[items]]
title = "Continuity Under Failure"
body = "Emergency communications experience shapes business continuity and disaster recovery plans around real failure conditions, practical testing, and operational recovery."

[[items]]
title = "Both Sides Understood"
body = "Experience with defensive security and the underground provides context for threats, while deep Tor and I2P knowledge replaces fear stories with technical reality."

[[items]]
title = "Travel Data Exposure"
body = "I use OSINT and aircraft tracking to see what travel data reveals about a person or organization."

[[items]]
title = "Darknet Perspective"
body = "I use practical darknet knowledge to see what attackers can see about a person or organization."

[[items]]
title = "Emerging Technology Tracked"
body = "Active research covers developing systems and threats, including Veilid and post-quantum cryptography, with substantial work performed in the open source community."

[[items]]
title = "Evidence Before Claims"
body = "Clear questions expose weak assumptions, separate working knowledge from polished talk, and give clients evidence they can use when making technical decisions."
