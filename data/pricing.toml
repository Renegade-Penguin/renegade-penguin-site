# Pricing data. The owner approved these values on 2026-11-19.
# Pages show them only through the pricing shortcode; no page types a price by hand.
# Tiers and fields (reference list; scripts/test-claims.sh enforces them):
#   advisory: hourly, incident, retainer_small, retainer_standard, retainer_plus, retainer_terms, extra_hours
#   assessment: price, credit, small_practice
#   projects: minimum, hourly, drivers
#   ai_review: minimum, drivers
#   speaking: keynote, virtual, workshops, community, drivers

[advisory]
hourly = "$250 per hour"
incident = "$350 per hour"
retainer_small = "$3,000 per month for about 12 hours"
retainer_standard = "$5,500 per month for about 24 hours"
retainer_plus = "$9,000 per month for about 40 hours"
retainer_terms = "month to month with 30 days' notice; unused hours reset monthly, with up to 25% carried for one month"
extra_hours = "$225 per hour"

[assessment]
price = "a paid assessment starting at $4,000 and typically ranging from $4,000 to $12,000, depending on size and scope"
credit = "a credit equal to 50% of the assessment fee if the retainer is signed within 60 days"
small_practice = "an assessment followed by hourly help, with no retainer required"

[projects]
minimum = "from $5,000 per project"
hourly = "$250 per hour"
drivers = "quoted after a scoping call, with no retainer required"

[ai_review]
minimum = "a fixed scope starting at $7,500"
drivers = "acceptable use, shadow AI inventory, data flows, and vendor questions"

[speaking]
keynote = "$5,000 plus travel"
virtual = "$3,500"
workshops = "$5,000"
community = "free, at cost, or arranged"
drivers = "the organizer covers admission and, depending on the event, lodging and travel"
