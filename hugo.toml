baseURL = "https://renegadepenguinllc.com/"
title = "Renegade Penguin LLC"
locale = "en-US"
disableKinds = ["taxonomy", "term", "RSS"]
enableGitInfo = false

# --minify drops HTML comments by default; the email_off markers must survive it
# (scripts/test-email-off.sh). Templates emit no other comments (Hugo drops raw ones).
[minify.tdewolff.html]
  keepComments = true

[outputs]
  home = ["html", "robots", "llms"]

# /llms.txt, the llms.txt convention (https://llmstxt.org): a Markdown summary of the site for language-model
# readers (layouts/home.llms.txt). A plain text file Cloudflare Pages serves as text/plain, so _headers is
# unchanged; it is not an alternate of the home page and is not in the sitemap (scripts/test-crosslinks.sh).
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[params]
  # production by default; set HUGO_PARAMS_ENVIRONMENT=staging for the staging build.
  environment = "production"
  # Public Cloudflare Turnstile sitekey for the contact form. Empty by default: the contact page
  # then builds without the widget and without the Turnstile script (no third-party request).
  # Set it per environment with HUGO_PARAMS_TURNSTILESITEKEY; the secret key never lives here.
  turnstileSitekey = ""
  # Public GitHub organization profile; the only sameAs entry on the organization JSON-LD node.
  githubOrg = "https://github.com/Renegade-Penguin"
  # The public contact mailbox, for the email shortcode. Keep it in step with functions/api/_mail.js.
  contactEmail = "contact@renegadepenguinllc.com"

# The header menu is data-driven (data/nav.toml); the footer menu holds the trust and legal links only.
[[menus.footer]]
  name = "Privacy"
  url = "/privacy/"
  weight = 1
[[menus.footer]]
  name = "Terms"
  url = "/terms/"
  weight = 2
[[menus.footer]]
  name = "Accessibility"
  url = "/accessibility/"
  weight = 3
[[menus.footer]]
  name = "Security policy"
  url = "/security-policy/"
  weight = 4
[[menus.footer]]
  name = "Security and handling"
  url = "/security-and-handling/"
  weight = 5
[[menus.footer]]
  name = "Confidentiality and case studies"
  url = "/confidentiality-and-case-studies/"
  weight = 6

# Sitemap and canonical links: Hugo's sitemap lists every page; the thank-you page and the
# placeholder case studies index opt out in their own front matter and the 404 page is never
# listed (scripts/test-trust.sh and scripts/test-robots.sh check this).
# Every page gets a sitemap lastmod from this one cascade (no git history is needed, so shallow CI
# checkouts and deploy builds behave the same). Bump the date when site content changes.
[[cascade]]
  lastmod = 2026-11-19

# The on-this-page panel lists H2 headings only.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = false
