baseURL = "https://renegadepenguinllc.com/"
title = "Renegade Penguin LLC"
locale = "en-US"
disableKinds = ["taxonomy", "term", "RSS"]
enableGitInfo = false

[outputs]
  home = ["html", "robots"]

[params]
  # production by default; set HUGO_PARAMS_ENVIRONMENT=staging for the staging build.
  environment = "production"
  # Public Cloudflare Turnstile sitekey for the contact form. Empty by default: the contact page
  # then builds without the widget and without the Turnstile script (no third-party request).
  # Set it per environment with HUGO_PARAMS_TURNSTILESITEKEY; the secret key never lives here.
  turnstileSitekey = ""
  # Public GitHub organization profile; the only sameAs entry on the organization JSON-LD node.
  githubOrg = "https://github.com/Renegade-Penguin"

# The header menu is data-driven (data/nav.toml); the footer menu holds the trust and legal links only.
[[menus.footer]]
  name = "Privacy"
  url = "/privacy/"
  weight = 1
[[menus.footer]]
  name = "Terms"
  url = "/terms/"
  weight = 2
[[menus.footer]]
  name = "Accessibility"
  url = "/accessibility/"
  weight = 3
[[menus.footer]]
  name = "Security policy"
  url = "/security-policy/"
  weight = 4
[[menus.footer]]
  name = "Security and handling"
  url = "/security-and-handling/"
  weight = 5
[[menus.footer]]
  name = "Confidentiality and case studies"
  url = "/confidentiality-and-case-studies/"
  weight = 6

# Sitemap and canonical links: Hugo's sitemap lists every page; the thank-you page opts out in
# its own front matter and the 404 page is never listed (scripts/test-trust.sh checks both).

# The on-this-page panel lists H2 headings only.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = false
