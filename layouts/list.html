{{ define "main" }}
<article class="page">
<h1>{{ .Title }}</h1>
{{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
{{ .Content }}
{{ $linked := where .Pages "RelPermalink" "ne" "" }}
{{ with $linked }}<ul class="page-list">{{ range . }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ul>{{ end }}
</article>
{{ end }}
