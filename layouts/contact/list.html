{{ define "main" }}
{{ .Content }}
{{- $sitekey := site.Params.turnstileSitekey -}}
<h2 id="form">Contact form</h2>
<form class="contact-form" method="post" action="/api/contact" aria-labelledby="form">
  <p class="field">
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" required maxlength="100" autocomplete="name">
  </p>
  <p class="field">
    <label for="email">Work email</label>
    <input id="email" name="email" type="email" required maxlength="200" autocomplete="email">
  </p>
  <p class="field">
    <label for="organization">Organization</label>
    <input id="organization" name="organization" type="text" required maxlength="200" autocomplete="organization">
  </p>
  <p class="field">
    <label for="size">Organization size (people)</label>
    <select id="size" name="size" required>
      <option value="">Choose one</option>
      <option value="1-10">1 to 10</option>
      <option value="11-50">11 to 50</option>
      <option value="51-250">51 to 250</option>
      <option value="251-1000">251 to 1,000</option>
      <option value="1001-plus">1,001 or more</option>
    </select>
  </p>
  <p class="field">
    <label for="need">What you need help with</label>
    <textarea id="need" name="need" required maxlength="4000" rows="7"></textarea>
    <span class="hint">Describe the problem as you understand it. Do not include passwords, keys or sensitive evidence.</span>
  </p>
  <p class="field">
    <label for="budget">Budget band</label>
    <select id="budget" name="budget" required>
      <option value="">Choose one</option>
      <option value="smaller-retainer">Smaller retainer</option>
      <option value="standard-retainer">Standard retainer</option>
      <option value="one-off-project">One-off project</option>
      <option value="not-sure">Not sure</option>
    </select>
  </p>
  <p class="field">
    <label for="timeline">Timeline</label>
    <select id="timeline" name="timeline" required>
      <option value="">Choose one</option>
      <option value="urgent">As soon as possible</option>
      <option value="1-2-months">Within 1 to 2 months</option>
      <option value="3-6-months">Within 3 to 6 months</option>
      <option value="no-date">No set date</option>
    </select>
  </p>
  <p class="field">
    <label for="heard">How you heard about Renegade Penguin (optional)</label>
    <input id="heard" name="heard" type="text" maxlength="200" autocomplete="off">
  </p>
  <div class="hp" aria-hidden="true">
    <label for="website">Leave this field empty</label>
    <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
  </div>
  <p class="field check">
    <label for="consent"><input id="consent" name="consent" type="checkbox" value="yes" required> <span>I consent to Renegade Penguin contacting me about this request.</span></label>
  </p>
  {{ with $sitekey }}<div class="cf-turnstile" data-sitekey="{{ . }}" data-action="contact" data-theme="dark"></div>{{ end }}
  <p><button type="submit">Send message</button></p>
</form>
{{ with $sitekey }}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{{ end }}
{{ end }}
