<section class="home-sec" id="built-in-the-open" aria-labelledby="built-in-the-open-h">
  {{ partial "section-head.html" (dict "n" "06" "title" .title "tag" .eyebrow "id" "built-in-the-open-h") }}
  <p class="lede">{{ .intro }}</p>
  <div class="grid grid-n{{ len .items }}">
    {{- range .items }}
    <div class="exhibit">
      <h3><a href="{{ .url }}" rel="noopener">{{ .title }}</a></h3>
      <p>{{ .body }}</p>
    </div>
    {{- end }}
  </div>
</section>
