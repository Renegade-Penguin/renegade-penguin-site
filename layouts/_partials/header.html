<header class="site-header">
  <div class="bar">
    <a class="brand" href="/">
      <img src="/brand/penguin-color.png" alt="Renegade Penguin mascot: a penguin holding a rifle" width="40" height="40">
      <span>Renegade Penguin LLC</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {{- $current := . -}}
        {{ range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <a class="btn btn-primary" href="/contact/">Book a fit call</a>
  </div>
</header>
